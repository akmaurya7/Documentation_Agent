[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "docagent"
version = "0.1.0"
description = "A fail-closed documentation engineer for GitHub repositories."
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.143.0",
  "httpx==0.28.1",
  "PyJWT==2.15.1",
  "cryptography==50.0.2",
  "anthropic==0.42.0",
  "pydantic==2.10.5",
  "pydantic-settings==2.7.1",
  "redis==5.2.1",
  "SQLAlchemy==2.0.36",
  "psycopg[binary]==3.2.3",
  "alembic==1.14.1",
  "structlog==25.1.0",
  "uvicorn[standard]==0.54.0",
  "tornado==6.5.9",
]

[project.optional-dependencies]
dev = [
  "mypy==1.14.1",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "pytest-asyncio==1.4.0",
  "ruff==0.9.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S105", "S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.coverage.run]
omit = ["src/docagent/main.py", "src/docagent/worker_main.py", "src/docagent/agent/provider.py", "src/docagent/codex_login.py"]
