name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: docagent
          POSTGRES_USER: docagent
          POSTGRES_PASSWORD: docagent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U docagent -d docagent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip==26.2.1
      - run: pip install -e ".[dev]"
      - name: Apply PostgreSQL migrations
        env:
          DOCAGENT_DATABASE_URL: postgresql+psycopg://docagent:docagent@localhost:5432/docagent
        run: alembic upgrade head
      - run: ruff check .
      - run: mypy src
      - run: pytest --cov=docagent --cov-fail-under=90
      - run: pip install pip-audit==2.7.3
      - run: pip-audit
      - run: docker build --tag docagent:ci .
