services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: docagent
      POSTGRES_USER: docagent
      POSTGRES_PASSWORD: docagent-local-only
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

  docagent:
    build: .
    env_file: .env
    environment:
      DOCAGENT_DATABASE_URL: postgresql://docagent:docagent-local-only@postgres:5432/docagent
    ports:
      - "8000:8000"
    depends_on:
      - redis
      - postgres
    read_only: true
    tmpfs:
      - /tmp

  worker:
    build: .
    env_file: .env
    environment:
      DOCAGENT_DATABASE_URL: postgresql://docagent:docagent-local-only@postgres:5432/docagent
    command: ["python", "-m", "docagent.worker_main"]
    depends_on:
      - redis
      - postgres
    read_only: true
    tmpfs:
      - /tmp

volumes:
  redis-data:
  postgres-data:
