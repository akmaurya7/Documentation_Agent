services:
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

  docagent:
    build: .
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      - redis
    read_only: true
    tmpfs:
      - /tmp

  worker:
    build: .
    env_file: .env
    command: ["python", "-m", "docagent.worker_main"]
    depends_on:
      - redis
    read_only: true
    tmpfs:
      - /tmp

volumes:
  redis-data:
